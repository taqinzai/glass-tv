name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          exec > probe-out.txt 2>&1
          H=$(curl -sL -H "Accept-Language: en" "https://www.youtube.com/@myqurantime")
          echo "$H" | grep -o '<link rel="canonical" href="[^"]*"' | head -1
          echo "$H" | grep -o '"externalId":"[^"]*"' | head -1
          for C in UCoV78AClgq3dygpsC6IUbDA UCsxC_RuP5MtEz62aV-ukROQ; do
            echo "== $C"
            curl -s -o f.xml -w '%{http_code}\n' "https://www.youtube.com/feeds/videos.xml?channel_id=$C"; grep -o '<title>[^<]*</title>\|<yt:videoId>[^<]*' f.xml | head -8
            curl -s -o g.xml -w 'pl %{http_code}\n' "https://www.youtube.com/feeds/videos.xml?playlist_id=UU${C:2}"; grep -o '<title>[^<]*</title>' g.xml | head -2
          done
      - run: |
          git config user.name taqinzai; git config user.email muttaqin300804@gmail.com
          git add probe-out.txt && git commit -m "probe output" && git push -f origin HEAD:probe
